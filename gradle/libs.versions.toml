[versions]
dex2jar = "2.4.28"
# The Cloudstream `library` JVM artifact. Pinned to the commit that matches the `cloudstream3:pre-release` stub the
# extensions repo compiles against (fetched 2026-10-14; library sources unchanged until dc9d1f0f on 2026-10-21).
cloudstream = "94e955836b"
ktor = "3.5.2"
coroutines = "1.11.0"
serialization = "1.11.0"
# The plugin runtime: same versions the extensions repo's root build.gradle.kts pins.
nicehttp = "0.4.18"
jsoup = "1.22.2"
jackson = "2.13.1"
rhino = "1.8.1"
# The Android app.
media3 = "1.11.1"
okhttp = "5.5.1"
camerax = "1.6.2"
# libass for Media3; 0.5.x builds against the same Media3 version.
ass = "0.5.1"

[libraries]
junit = { module = "junit:junit", version = "4.13.2" }
dex2jar = { module = "de.femtopedia.dex2jar:dex-translator", version.ref = "dex2jar" }
cloudstream-library = { module = "com.github.recloudstream.cloudstream:library-jvm", version.ref = "cloudstream" }
nicehttp = { module = "com.github.Blatzar:NiceHttp", version.ref = "nicehttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
fuzzywuzzy = { module = "me.xdrop:fuzzywuzzy", version = "1.4.0" }
gson = { module = "com.google.code.gson:gson", version = "2.14.0" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version = "1.84" }
androidx-annotation = { module = "androidx.annotation:annotation-jvm", version = "1.10.0" }

ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version = "3.54.1.0" }
logback = { module = "ch.qos.logback:logback-classic", version = "1.5.38" }
jul-to-slf4j = { module = "org.slf4j:jul-to-slf4j", version = "2.0.17" }

androidx-core = { module = "androidx.core:core-ktx", version = "1.19.1" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.13.0" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.11.0" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.11.0" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version = "2.10.2" }
androidx-datastore = { module = "androidx.datastore:datastore-preferences", version = "1.3.0" }
compose-bom = { module = "androidx.compose:compose-bom", version = "2026.09.00" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
ass-media = { module = "io.github.peerless2012:ass-media", version.ref = "ass" }
ass-kt = { module = "io.github.peerless2012:ass-kt", version.ref = "ass" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
