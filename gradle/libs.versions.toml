[versions]
# Toolchain level.
jvm = "17"

# Build plugins.
kotlin = "2.4.21"
# AGP 9.5 needs Gradle 9.6+.
agp = "9.5.0"
shadow = "9.6.1"

# The server.
ktor = "3.5.2"
coroutines = "1.11.0"
serialization = "1.11.0"
sqlite-jdbc = "3.54.1.0"
logback = "1.5.38"
jul-to-slf4j = "2.0.17"
dex2jar = "2.4.28"
# The Cloudstream `library` JVM artifact. Pinned to the commit that matches the `cloudstream3:pre-release` stub the
# extensions repo compiles against (fetched 2026-10-14; library sources unchanged until dc9d1f0f on 2026-10-21).
cloudstream = "94e955836b"

# The plugin runtime: same versions the extensions repo's root build.gradle.kts pins.
nicehttp = "0.4.18"
jsoup = "1.22.2"
jackson = "2.13.1"
rhino = "1.8.1"
fuzzywuzzy = "1.4.0"
gson = "2.14.0"
bcpkix = "1.84"
androidx-annotation = "1.10.0"

# The Android app.
androidx-core = "1.19.1"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.0"
androidx-navigation = "2.10.2"
androidx-datastore = "1.3.0"
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"
compose-bom = "2026.09.00"
compose-icons = "1.7.8"
media3 = "1.11.1"
# libass for Media3; 0.5.x builds against the same Media3 version.
ass = "0.5.1"
okhttp = "5.5.1"
coil = "3.6.3"
camerax = "1.6.2"
mlkit-barcode = "17.3.0"
junit = "4.13.2"

[libraries]
# Server
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
jul-to-slf4j = { module = "org.slf4j:jul-to-slf4j", version.ref = "jul-to-slf4j" }
dex2jar = { module = "de.femtopedia.dex2jar:dex-translator", version.ref = "dex2jar" }
cloudstream-library = { module = "com.github.recloudstream.cloudstream:library-jvm", version.ref = "cloudstream" }

# Plugin runtime
nicehttp = { module = "com.github.Blatzar:NiceHttp", version.ref = "nicehttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
fuzzywuzzy = { module = "me.xdrop:fuzzywuzzy", version.ref = "fuzzywuzzy" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bcpkix" }
androidx-annotation = { module = "androidx.annotation:annotation-jvm", version.ref = "androidx-annotation" }

# Shared by the server and the Android app
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Android app
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
androidx-datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons = { module = "androidx.compose.material:material-icons-extended", version.ref = "compose-icons" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
ass-media = { module = "io.github.peerless2012:ass-media", version.ref = "ass" }
ass-kt = { module = "io.github.peerless2012:ass-kt", version.ref = "ass" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-sse = { module = "com.squareup.okhttp3:okhttp-sse", version.ref = "okhttp" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
mlkit-barcode = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit-barcode" }

# Tests
junit = { module = "junit:junit", version.ref = "junit" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
