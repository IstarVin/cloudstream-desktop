<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f13" />
    <title>Connect to Cloudstream</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #0e0f13;
        color: #f4f4f5;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
      }
      main {
        width: min(28rem, 100%);
        box-sizing: border-box;
        padding: 2rem;
      }
      svg {
        width: 48px;
        height: 48px;
      }
      h1 {
        font-size: 1.75rem;
        line-height: 1.2;
        margin: 2rem 0 1rem;
        text-wrap: balance;
      }
      p {
        color: #b8bac4;
        line-height: 1.6;
        margin: 0 0 2rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 1.25rem;
        border-radius: 10px;
        background: #ff8a4c;
        color: #1d0e05;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: #ffa36f;
      }
      a:focus-visible {
        outline: 2px solid #f4f4f5;
        outline-offset: 4px;
      }
      ::selection {
        background: #ff8a4c;
        color: #1d0e05;
      }
    </style>
  </head>
  <body>
    <main>
      <svg aria-label="Cloudstream" role="img" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="8" fill="#ff8a4c" />
        <path
          d="M12 9.5v13a1 1 0 0 0 1.5.86l10-6.5a1 1 0 0 0 0-1.72l-10-6.5A1 1 0 0 0 12 9.5z"
          fill="#1d0e05"
        />
      </svg>
      <h1>Can’t reach Cloudstream</h1>
      <p>
        Check your connection and make sure your Cloudstream server is running. Browsing and
        playback need a connection to the server.
      </p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
