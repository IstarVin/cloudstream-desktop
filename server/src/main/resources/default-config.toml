# cloudstream-desktop configuration. Restart the service after editing.
# Settings marked (UI) can also be changed on the Settings page; the page's value wins once set there.

bind = "0.0.0.0:6969"            # LAN remote is a v1 goal; use 127.0.0.1 to keep it desktop-only

# Where plugins come from (UI): "dev" builds the local extensions repo at dev_path, "repo" downloads the published
# jars listed by repo_url (a repo.json or plugins.json). Defaults to dev when dev_path holds a checkout, else repo.
# plugins.source = "repo"
plugins.repo_url = "https://raw.githubusercontent.com/NropVox/cloudstream-extensions-nropvox/builds/repo.json"   # (UI)
plugins.dev_path = "/mnt/AJ/Projects/cloudstream-extensions-istarvin"
plugins.build_on_start = true    # dev mode: run gradlew for enabled modules at startup
plugins.disabled = ["Fetcharr", "StreamCorner"]   # (UI)

mpv.path = "mpv"
mpv.extra_args = []              # (UI) e.g. ["--profile=gpu-hq"]

playback.autoplay_best = true    # (UI)
playback.autoplay_min_links = 3  # (UI)
playback.autoplay_wait_ms = 6000 # (UI)
playback.autoplay_next = true    # (UI)
playback.proxy_all = false       # (UI) send every stream through the built-in proxy, not just ones mpv can't fetch

ui.show_nsfw = false             # (UI)

# Where android.jar comes from (only its class shapes are used). Defaults to the SDK the extensions repo builds with.
# android.sdk_path = "/home/you/Android/Sdk"

# Chromium, for sites behind Cloudflare or that need a real browser (tier C plugins). It starts on demand.
chromium.path = "chromium"       # or a full path; google-chrome also works
chromium.mode = "headless"       # (UI) headless | xvfb (needs Xvfb) | headed (a visible window)
chromium.idle_minutes = 10       # stop it after this long unused

# At most this many parallel requests to one host from the plugins (OkHttp deadlocks around 5 with Cloudflare).
network.max_requests_per_host = 2
