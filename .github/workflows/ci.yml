# Server, web and Android checks on every push and pull request. Plugin builds stay local: they need the extensions repo and
# the Android SDK. The Chromium tests use the runner's preinstalled Google Chrome.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pnpm
        run: npm install -g pnpm@12.16.1

      # The local vite-plus package provides `vp`, which the Gradle build also calls.
      - name: Install web dependencies
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Web checks and tests
        working-directory: web
        run: vp check && vpr check && vp test

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs.
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Server tests
        run: ./gradlew --console=plain :shared:test :server:test

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: server/build/reports/tests/test

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and lint the app
        run: ./gradlew --console=plain :android:assembleDebug :android:lintDebug
