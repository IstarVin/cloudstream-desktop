# Server, web and Android checks on main and pull requests. Release tags reuse these checks.
# Plugin builds stay local: they need the extensions repo and
# the Android SDK. The Chromium tests use the runner's preinstalled Google Chrome.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Release tooling tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install pnpm
        run: npm install -g pnpm@12.16.1

      # The local vite-plus package provides `vp`, which the Gradle build also calls.
      - name: Install web dependencies
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Web checks and tests
        working-directory: web
        run: vp check && vpr check && vp test

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs.
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Server tests
        run: ./gradlew --console=plain :shared:test :server:test

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-report
          path: server/build/reports/tests/test

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and lint the app
        run: ./gradlew --console=plain :android:assembleDebug :android:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error

  auth-worker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: auth-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install pnpm
        run: npm install -g pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - name: Check authentication Worker
        run: pnpm run check && pnpm test && pnpm exec wrangler deploy --dry-run
