name: Android release

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Android tag to release (for example android-v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Expected android-vMAJOR.MINOR.PATCH, optionally followed by a prerelease suffix."
            exit 1
          fi
          echo "name=${RELEASE_TAG#android-v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate release notes
        shell: bash
        run: |
          notes="release-notes/$RELEASE_TAG.md"
          if [[ ! -s "$notes" ]] || ! grep -q '[^[:space:]]' "$notes" || grep -Eiq '\b(TODO|TBD)\b' "$notes"; then
            echo "::error::Commit finished release notes in $notes before tagging."
            exit 1
          fi

      - name: Prepare release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;30.0.16248370

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, test and lint release
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          # AGP exposes this module's unit tests on the debug variant.
          ./gradlew --console=plain :android:assembleRelease :android:testDebugUnitTest :shared:test :android:lintRelease \
            "-PandroidVersionName=$VERSION_NAME" "-PandroidVersionCode=$GITHUB_RUN_NUMBER"

      - name: Prepare release assets
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist
          cp android/build/outputs/apk/release/android-release.apk "dist/cloudstream-android-$VERSION_NAME.apk"
          cd dist
          sha256sum ./*.apk > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          flags=()
          if [[ "$VERSION_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS \
            --verify-tag --title "Android $VERSION_NAME" \
            --notes-file "release-notes/$RELEASE_TAG.md" "${flags[@]}"

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.jks"
