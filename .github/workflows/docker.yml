# Publishes development images on main and versioned images/releases on server-v* tags.
name: Docker

on:
  push:
    branches: [main]
    tags: ["server-v*"]
    # Tag pushes always run: GitHub applies path filters only to branch pushes.
    paths-ignore:
      - "release-notes/**"
      - "docs/**"
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer main push supersedes a running one, so an older build cannot publish latest last.
# Tag builds each get their own group and are never cancelled.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate server release
        if: startsWith(github.ref, 'refs/tags/server-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python3 -c 'import sys; sys.path.insert(0, "scripts"); from release import parse; import os; parse(os.environ["RELEASE_TAG"].removeprefix("server-v"))'
          notes="release-notes/$RELEASE_TAG.md"
          if [[ ! -s "$notes" ]] || ! grep -q '[^[:space:]]' "$notes" || grep -Eiq '\b(TODO|TBD)\b' "$notes"; then
            echo "::error::Commit finished release notes in $notes before tagging."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Main pushes always publish latest. A server tag publishes it too only when the tagged
      # commit is still the tip of main, so a notes-only release commit (which skips the main
      # build) is covered and an older tag never moves latest back.
      - name: Check whether latest applies
        id: main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ -z "$main_sha" ]]; then
            echo "::error::Could not resolve origin/main."
            exit 1
          fi
          echo "is_main=$([[ "$GITHUB_SHA" == "$main_sha" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ steps.main.outputs.is_main }}
            type=sha
            type=semver,pattern={{version}},match=^server-v(.*)$
            type=semver,pattern={{major}}.{{minor}},match=^server-v(.*)$

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/server-v')
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Publish server GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        shell: bash
        run: |
          version="${RELEASE_TAG#server-v}"
          image="ghcr.io/${GH_REPO,,}:$version"
          cp "release-notes/$RELEASE_TAG.md" "$RUNNER_TEMP/server-release.md"
          {
            printf '\n## Docker image\n\n'
            printf '```bash\ndocker pull %s\n```\n' "$image"
            printf '\nImage digest: `%s`\n' "$IMAGE_DIGEST"
          } >> "$RUNNER_TEMP/server-release.md"
          flags=()
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "Server $version" \
            --notes-file "$RUNNER_TEMP/server-release.md" "${flags[@]}"
