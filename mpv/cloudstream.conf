# Default options for cloudstream.lua. Copy to ~/.config/mpv/script-opts/cloudstream.conf to change them
# (install.sh does this if the file doesn't exist yet). Keys use mpv's key names: "N" is Shift+n.
key_next=N
key_prev=P
key_sources=S
key_episodes=E
key_watched_next=W
# Skips an anime opening/ending (AniSkip); bound only while the "Skip" prompt shows.
key_skip=TAB
osd_duration=4
# Use uosc menus and buttons when uosc is installed. Buttons: add button:cs_prev, button:cs_next, button:cs_sources,
# button:cs_episodes and button:cs_skip to `controls` in uosc.conf.
uosc=yes
